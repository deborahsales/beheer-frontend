<button class="menu-button" (click)="toggleSidebar()">
  <mat-icon>menu</mat-icon>
</button>
<div
  class="sidebar-overlay"
  *ngIf="isSidebarOpen"
  (click)="toggleSidebar()"
></div>
<aside class="sidebar" [ngClass]="{ open: isSidebarOpen }">
  <div class="sidebar__logo">
    <img src="assets/beheer.svg" alt="Logo" />
  </div>

  <nav class="sidebar__nav">
    <a
      *ngFor="let link of links"
      [routerLink]="link.route"
      routerLinkActive="active"
    >
      <span *ngIf="link.icon" class="material-icons">{{ link.icon }}</span>
      {{ link.label }}
    </a>
  </nav>

  <div class="user-section">
    <div class="user-section__details">
      <app-user-avatar [name]="userName"></app-user-avatar>
      <div class="user-section__name">{{ userName }}</div>
    </div>
    <button class="user-section__button" (click)="onLogout()">
      <span class="material-icons">logout</span>
      Sair
    </button>
  </div>
</aside>
