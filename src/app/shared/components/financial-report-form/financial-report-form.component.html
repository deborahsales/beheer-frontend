<div class="financial-report-modal">
  <h2 class="financial-report-modal__title">Nova prestação</h2>
  <mat-dialog-content>
    <form
      [formGroup]="form"
      class="financialReport-page__form"
      (ngSubmit)="onSubmit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="descricao"></textarea>
        <mat-error *ngIf="form.get('descricao')?.hasError('required')">
          Descrição é obrigatória
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Data</mat-label>
        <input input matInput [matDatepicker]="picker" formControlName="data" />

        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="form.get('data')?.hasError('required')">
          Data é obrigatória
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Valor</mat-label>
        <input
          matInput
          type="number"
          formControlName="valor"
          min="0"
          step="0.01"
          placeholder="0.00"
        />
        <mat-error *ngIf="form.get('valor')?.hasError('required')">
          Valor é obrigatório
        </mat-error>
      </mat-form-field>

      <input type="file" accept="image/*" (change)="onFileSelected($event)" />

      <div class="financial-report-modal__image-wrapper" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Imagem selecionada" width="200" />
      </div>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button
      mat-flat-button
      color="primary"
      [disabled]="form.invalid"
      (click)="onSubmit()"
    >
      Criar
    </button>
  </mat-dialog-actions>
</div>
