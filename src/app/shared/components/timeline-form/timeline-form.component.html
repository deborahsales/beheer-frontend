<div class="timeline-modal">
  <h2 class="timeline-modal__title">Novo cronograma</h2>
  <mat-dialog-content>
    <form
      [formGroup]="form"
      class="timeline-modal__wrapper"
      (ngSubmit)="onSubmit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Título</mat-label>
        <input matInput formControlName="titulo" />
        <mat-error *ngIf="form.get('titulo')?.hasError('required')">
          Título é obrigatório
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="descricao"></textarea>
        <mat-error *ngIf="form.get('descricao')?.hasError('required')">
          Descrição é obrigatória
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data de início</mat-label>
        <input
          input
          matInput
          [matDatepicker]="picker"
          formControlName="dataInicio"
        />

        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="form.get('dataInicio')?.hasError('required')">
          Data de início é obrigatória
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data de término</mat-label>
        <input
          input
          matInput
          [matDatepicker]="picker2"
          formControlName="dataTermino"
        />

        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker2"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker
        ><mat-error *ngIf="form.get('dataTermino')?.hasError('required')"
          >Data de término é obrigatória
        </mat-error>
        <mat-error *ngIf="form.get('dataTermino')?.hasError('dataRangeInvalid')"
          >Data de término inválida.
        </mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button
      mat-flat-button
      color="primary"
      [disabled]="form.invalid"
      (click)="onSubmit()"
    >
      Criar
    </button>
  </mat-dialog-actions>
</div>
