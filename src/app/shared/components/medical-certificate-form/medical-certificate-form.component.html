<div class="medical-certificate-modal">
  <h2 class="medical-certificate-modal__title">Novo atestado</h2>
  <mat-dialog-content>
    <form
      [formGroup]="form"
      class="financialReport-page__form"
      (ngSubmit)="onSubmit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Data atestado</mat-label>
        <input
          input
          matInput
          [matDatepicker]="picker"
          formControlName="dataAtestado"
        />

        <mat-datepicker-toggle
          matIconSuffix
          [for]="picker"
        ></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="form.get('dataAtestado')?.hasError('required')">
          Data é obrigatória
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Hora de início</mat-label>
        <input matInput type="time" formControlName="horaInicio" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Hora de termino</mat-label>
        <input matInput type="time" formControlName="horaTermino" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Dia inteiro</mat-label>
        <mat-select formControlName="diaInteiro">
          <mat-option>--</mat-option>
          @for (opcao of DiaInteiro; track opcao) {
          <mat-option [value]="opcao.value">{{ opcao.viewValue }}</mat-option>
          }
        </mat-select>
        @if (form.get('diaInteiro')?.errors) {
        <mat-error>Dia inteiro é obrigatório</mat-error>
        }
      </mat-form-field>

      <input type="file" accept="image/*" (change)="onFileSelected($event)" />

      <div
        class="medical-certificate-modal__image-wrapper"
        *ngIf="imagePreview"
      >
        <img [src]="imagePreview" alt="Imagem selecionada" width="200" />
      </div>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button
      mat-flat-button
      color="primary"
      [disabled]="form.invalid"
      (click)="onSubmit()"
    >
      Criar
    </button>
  </mat-dialog-actions>
</div>
