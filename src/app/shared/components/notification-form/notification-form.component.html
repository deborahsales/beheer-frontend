<div class="notification-modal">
  @if(step === 1){
  <h2 class="notification-modal__title">Novo aviso</h2>
  <mat-dialog-content>
    <form [formGroup]="form" class="notification-modal__wrapper">
      <mat-form-field appearance="outline">
        <mat-label>Assunto</mat-label>
        <input matInput formControlName="assunto" />
        <mat-error *ngIf="form.get('assunto')?.hasError('required')">
          Assunto é obrigatório
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Conteúdo</mat-label>
        <textarea matInput formControlName="conteudo"></textarea>
        <mat-error *ngIf="form.get('conteudo')?.hasError('required')">
          Conteúdo é obrigatório
        </mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-flat-button
      color="primary"
      [disabled]="form.invalid"
      (click)="nextStep([])"
    >
      Avançar
    </button>
  </mat-dialog-actions>
  } @else if (step === 2) {
  <app-item-selection
    [title]="'Selecionar usuários'"
    [steps]="true"
    (save)="nextStep($event)"
    (step)="previousStep()"
  ></app-item-selection>
  } @else{
  <app-item-selection
    [title]="'Selecionar grupos'"
    [funcao]="'GRUPO'"
    (save)="onSubmit($event)"
    (step)="previousStep()"
  ></app-item-selection>
  }
</div>
