<app-container>
  @if (isLoading()) {
  <app-progress-spinner></app-progress-spinner>
  }
  <section class="tasks-page">
    <app-features-header
      [title]="'Demandas'"
      [buttonName]="'Nova demanda'"
      [inputPlaceholder]="'Buscar demanda...'"
      [canCreate]="canManage"
      [(searchInput)]="searchInput"
      (filter)="applyFilter()"
      (buttonClick)="createTask()"
    ></app-features-header>
    <app-tasks-table
      [canManage]="canManage"
      [role]="role"
      [filteredTasks]="filteredTasks"
      (applyFilter)="applyFilter()"
    ></app-tasks-table>
  </section>
</app-container>
