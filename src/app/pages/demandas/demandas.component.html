<app-container>
  @if (isLoading()) {
  <app-progress-spinner></app-progress-spinner>
  }
  <section class="tasks-page">
    <app-features-header
      [title]="'Demandas'"
      [buttonName]="'Nova demanda'"
      [inputPlaceholder]="'Buscar demanda...'"
      [canCreate]="canManage"
      [(searchInput)]="searchInput"
      (filter)="applyFilter()"
      (buttonClick)="createTask()"
    ></app-features-header>
    <div class="toggle">
      <mat-button-toggle-group
        class="custom-toggle-group"
        [formControl]="statusFilterControl"
      >
        <mat-button-toggle value="CRIADA">Criada</mat-button-toggle>
        <mat-button-toggle value="ATRASADA">Atrasada</mat-button-toggle>
        <mat-button-toggle value="INICIADA">Iniciada</mat-button-toggle>
        <mat-button-toggle value="FINALIZADA">Finalizada</mat-button-toggle>
      </mat-button-toggle-group>

      <button class="action-button" (click)="reset(); $event.stopPropagation()">
        <span class="material-icons">close</span>
      </button>

      <mat-slide-toggle [(ngModel)]="isChecked">{{
        isChecked ? "Kanban" : "Tabela"
      }}</mat-slide-toggle>
    </div>
    @if (!isChecked){
    <app-tasks-table
      [canManage]="canManage"
      [role]="role"
      [filteredTasks]="filteredTasks"
      (applyFilter)="applyFilter()"
    ></app-tasks-table>
    } @else {
    <app-tasks-kanban
      [filteredTasks]="filteredTasks"
      (updateStatus)="handleUpdateStatus($event)"
    ></app-tasks-kanban>
    }
  </section>
</app-container>
