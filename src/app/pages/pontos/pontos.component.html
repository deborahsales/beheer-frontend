<app-container>
  @if (isLoading()) {
  <app-progress-spinner></app-progress-spinner>
  }
  <section class="attendance-page">
    <app-features-header
      [title]="'Pontos'"
      [buttonName]="'Registro de ponto'"
      [inputPlaceholder]="'Buscar...'"
      [canCreate]="canCreate"
      [(searchInput)]="searchInput"
      (filter)="applyFilter()"
      (buttonClick)="registerAttendance()"
    ></app-features-header>
    <div class="attendance__content"></div>
  </section>
</app-container>
