<app-container>
  @if (isLoading()) {
  <app-progress-spinner></app-progress-spinner>
  }
  <section class="notifications-page">
    <app-features-header
      [title]="'Avisos'"
      [buttonName]="'Novo aviso'"
      [inputPlaceholder]="'Buscar aviso...'"
      [canCreate]="canCreate"
      [(searchInput)]="searchInput"
      (filter)="applyFilter()"
      (buttonClick)="createNotification()"
    ></app-features-header>
    <div class="notifications-page__content"></div>
  </section>
</app-container>
